[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyl-poil"
version = "1.0.0"
description = "Détection de supports radioélectriques sur orthophotos IGN - FrHack! 2026 Challenge 4"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "folium>=0.15",
  "matplotlib>=3.8",
  "torch>=2.0",
  "ultralytics>=8.2,<9",
]

[project.scripts]
pyl-poil = "pyl_poil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
